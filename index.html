/* ---------- Kleuren (iOS) ---------- */
:root {
  --bg: #F2F2F7;
  --kaart: #FFFFFF;
  --groep: #FFFFFF;
  --sheet: #F2F2F7;
  --tekst: #000;
  --sec: #8E8E93;
  --accent: #007AFF;
  --groen: #34C759;
  --oranje: #FF9500;
  --rood: #FF3B30;
  --spoor: #E5E5EA;
  --scheiding: rgba(60, 60, 67, .2);
  --nav: rgba(242, 242, 247, .8);
  --backdrop: rgba(0, 0, 0, .35);
  --grabber: #C7C7CC;
  --segment: #E3E3E8;
  --segment-actief: #FFFFFF;
  color-scheme: light dark;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000;
    --kaart: #1C1C1E;
    --groep: #2C2C2E;
    --sheet: #1C1C1E;
    --tekst: #FFF;
    --spoor: #38383A;
    --scheiding: rgba(84, 84, 88, .65);
    --nav: rgba(0, 0, 0, .75);
    --backdrop: rgba(0, 0, 0, .55);
    --grabber: #48484A;
    --segment: #2C2C2E;
    --segment-actief: #636366;
  }
}

/* ---------- Basis ---------- */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--tekst);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  font-size: 17px;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
}
body { overflow: hidden; }

button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
}

.groen { color: var(--groen); }
.oranje { color: var(--oranje); }
.rood { color: var(--rood); }
.accent { color: var(--accent); }

/* ---------- Schermen ---------- */
.view {
  position: fixed;
  inset: 0;
  overflow-y: auto;
  overscroll-behavior-y: contain;
  -webkit-overflow-scrolling: touch;
  background: var(--bg);
  transition: transform .35s cubic-bezier(.2, .8, .2, 1);
}
.view.push { transform: translateX(100%); z-index: 10; box-shadow: -8px 0 24px rgba(0, 0, 0, .08); }
.view.push.open { transform: none; }
#home.achter { transform: translateX(-25%); }

.content {
  max-width: 600px;
  margin: 0 auto;
  padding: 0 16px calc(40px + env(safe-area-inset-bottom));
  padding-left: max(16px, env(safe-area-inset-left));
  padding-right: max(16px, env(safe-area-inset-right));
}

/* ---------- Navigatiebalk ---------- */
.navbar {
  position: sticky;
  top: 0;
  z-index: 5;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  min-height: calc(44px + env(safe-area-inset-top));
  padding: env(safe-area-inset-top) max(16px, calc((100% - 600px) / 2 + 16px)) 0;
  background: var(--nav);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  backdrop-filter: saturate(180%) blur(20px);
  box-shadow: 0 .5px 0 transparent;
  transition: box-shadow .2s;
}
.navbar.scrolled { box-shadow: 0 .5px 0 var(--scheiding); }

.nav-title {
  grid-column: 2;
  font-size: 17px;
  font-weight: 600;
  opacity: 0;
  transition: opacity .2s;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 55vw;
}
.navbar.scrolled .nav-title { opacity: 1; }
.nav-links { grid-column: 1; grid-row: 1; justify-self: start; }
.nav-rechts { grid-column: 3; grid-row: 1; justify-self: end; }

.rond-btn {
  width: 34px;
  height: 34px;
  border-radius: 999px;
  display: grid;
  place-items: center;
  background: var(--accent);
  color: #fff;
  transition: transform .15s;
}
.rond-btn:active { transform: scale(.9); }

.terug-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-left: -6px;
  padding: 8px 6px;
  color: var(--accent);
  font-size: 17px;
}
.terug-btn:active { opacity: .5; }

.large-title {
  font-size: 34px;
  font-weight: 700;
  letter-spacing: .01em;
  line-height: 41px;
  margin: 2px 0 14px;
  overflow-wrap: anywhere;
}

.sectie-kop {
  font-size: 22px;
  font-weight: 700;
  margin: 28px 0 10px;
}

/* ---------- Kaarten ---------- */
.card {
  background: var(--kaart);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 12px;
}

.boek-kaart {
  cursor: pointer;
  transition: transform .15s;
  user-select: none;
  -webkit-user-select: none;
}
.boek-kaart:active { transform: scale(.97); }

.boek-kop { display: flex; align-items: center; gap: 8px; }
.boek-titel {
  flex: 1;
  font-size: 17px;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.chevron { color: var(--grabber); flex: none; }

.voortgang {
  height: 6px;
  border-radius: 999px;
  background: var(--spoor);
  overflow: hidden;
  margin: 12px 0 6px;
}
.voortgang > span {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: var(--accent);
  transition: width .4s ease;
}
.voortgang.klaar > span { background: var(--groen); }

.meta { font-size: 13px; color: var(--sec); font-variant-numeric: tabular-nums; }

.vandaag-groot {
  font-size: 28px;
  font-weight: 700;

function planning(boek, vandaag) {
  const gelezen = somLogs(boek.logs);
  const rest = Math.max(0, boek.totaalPaginas - gelezen);
  // Nog niet gestart? Dan pas tellen vanaf de startdatum.
  const vanaf = vandaag < boek.startDatum ? boek.startDatum : vandaag;
  const vandaagGelezen = boek.logs[vandaag] || 0;
  const startTel = vanaf === vandaag && vandaagGelezen > 0 ? 1 : 0; // morgen of vandaag
  const dagen = dagenTussen(vanaf, boek.deadline) + 1 - startTel;
  const perDag = dagen > 0 ? Math.ceil(rest / dagen) : rest;
  return { gelezen, rest, dagen: Math.max(0, dagen), perDag, vandaagGelezen };
}

// Het doel zoals het gold bij het begin van `datum`: bepaalt groen/oranje in de kalender.
function doelOp(boek, datum) {
  if (datum < boek.startDatum || datum > boek.deadline) return 0;
  const rest = Math.max(0, boek.totaalPaginas - somLogs(boek.logs, d => d < datum));
  return Math.ceil(rest / (dagenTussen(datum, boek.deadline) + 1));
}

function status(boek, vandaag) {
  const p = planning(boek, vandaag);
  if (p.rest === 0) return { soort: "klaar", p };
  if (vandaag > boek.deadline) return { soort: "gemist", p };
  if (vandaag < boek.startDatum) return { soort: "gepland", p };
  const doel = doelOp(boek, vandaag);
  return { soort: p.vandaagGelezen >= doel ? "gehaald" : "bezig", p, doel };
}

/* ================= Hulpjes ================= */

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const chevron = `<svg class="chevron" viewBox="0 0 8 14" width="8" height="14" aria-hidden="true"><path d="m1 1 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

/* ================= Homescreen ================= */

function boekKaart(b, vandaag) {
  const s = status(b, vandaag), p = s.p;
  const pct = Math.min(100, Math.round((p.gelezen / b.totaalPaginas) * 100));
  let groot = "", sub = "", melding = "";

  switch (s.soort) {
    case "klaar":
      groot = `<span class="groen">Uitgelezen! üéâ</span>`;
      sub = `${pag(b.totaalPaginas)} gelezen`;
      break;
    case "gemist":
      melding = `<div class="melding rood">Deadline gemist, nog ${pag(p.rest)}</div>`;
      sub = `Deadline was ${kort(b.deadline)}`;
      break;
    case "gepland":
      groot = `Start ${kort(b.startDatum)}`;
      sub = `Daarna ${pag(p.perDag)} per dag`;
      break;
    case "gehaald":
      groot = `Vandaag: <span class="groen">${pag(p.vandaagGelezen)}</span>`;
      sub = `Doel van ${s.doel} gehaald ‚úì` + (p.dagen > 0 ? ` ¬∑ morgen ${p.perDag}` : "");
      break;
    default:
      groot = `Vandaag: <span class="accent">${pag(s.doel)}</span>`;
      sub = p.vandaagGelezen > 0
        ? `${p.vandaagGelezen} gelezen, nog ${s.doel - p.vandaagGelezen} te gaan`
        : `Nog ${pag(p.rest)} ¬∑ tot ${kort(b.deadline)}`;
  }

  const kanIngeven = s.soort !== "gepland";
  return `
    <div class="card boek-kaart" role="button" tabindex="0" data-open="${b.id}">
      <div class="boek-kop"><div class="boek-titel">${esc(b.titel)}</div>${chevron}</div>
      <div class="voortgang${p.rest === 0 ? " klaar" : ""}"><span style="width:${pct}%"></span></div>
      <div class="meta">${p.gelezen} / ${b.totaalPaginas} pagina's ¬∑ ${pct}%</div>
      ${groot ? `<div class="vandaag-groot">${groot}</div>` : melding}
      <div class="boek-voet">
        <span class="meta">${sub}</span>
        ${kanIngeven ? `<button class="pil" data-log="${b.id}">Ingeven</button>` : ""}
      </div>
    </div>`;
}

function renderLijst() {
  const vandaag = vandaagStr();
  $("boekenLijst").innerHTML = boeken.length
    ? boeken.map(b => boekKaart(b, vandaag)).join("")
    : `<div class="card leeg"><strong>Nog geen boeken</strong><p>Tik op + om je eerste boek toe te voegen.</p></div>`;
}

/* ================= Kalender ================= */

const nu = new Date();
let kalJaar = nu.getFullYear();
let kalMaand = nu.getMonth();

function celInhoud(datum, vandaag, plannen) {
  let gelezen = 0, doel = 0, relevant = false, deadline = false;

  for (const b of boeken) {
    if (b.deadline === datum) deadline = true;
    const log = b.logs[datum];

    if (datum <= vandaag) {
      // Verleden en vandaag: wat je gelezen hebt, tegenover het doel van die dag.
      const d = doelOp(b, datum);
      if (log !== undefined || d > 0) relevant = true;
      gelezen += log || 0;
      doel += d;
    } else {
      // Toekomst: het huidige perDag, tot en met de deadline.
      const p = plannen.get(b.id);
      if (p.rest > 0 && datum >= b.startDatum && datum <= b.deadline) {
        doel += p.perDag;
        relevant = true;
      }
    }
  }

  if (!relevant) return { tekst: "", klasse: "", deadline };
  if (datum > vandaag) return { tekst: doel, klasse: "", deadline };
  if (datum === vandaag) {
    if (gelezen > 0 && gelezen >= doel) return { tekst: gelezen, klasse: "groen", deadline };
    return { tekst: gelezen > 0 ? `${gelezen}/${doel}` : doel, klasse: "accent", deadline };
  }
  const klasse = doel === 0 ? (gelezen > 0 ? "groen" : "") : gelezen >= doel ? "groen" : "oranje";
  return { tekst: gelezen, klasse, deadline };
}

function renderKalender() {
  const vandaag = vandaagStr();
  const eerste = new Date(kalJaar, kalMaand, 1);
  $("maandTitel").textContent = fmtMaand.format(eerste);

  const plannen = new Map(boeken.map(b => [b.id, planning(b, vandaag)]));
  const leeg = (eerste.getDay() + 6) % 7; // week begint op maandag
  const aantalDagen = new Date(kalJaar, kalMaand + 1, 0).getDate();

  let html = ["ma", "di", "wo", "do", "vr", "za", "zo"].map(d => `<div class="kal-dagnaam">${d}</div>`).join("");
  html += "<div></div>".repeat(leeg);

  for (let dag = 1; dag <= aantalDagen; dag++) {
    const datum = `${kalJaar}-${pad(kalMaand + 1)}-${pad(dag)}`;
    const c = celInhoud(datum, vandaag, plannen);
    const klassen = ["kal-cel"];
    if (datum < vandaag) klassen.push("verleden");
    if (datum === vandaag) klassen.push("vandaag");
    if (c.deadline) klassen.push("deadline");
    html += `<div class="${klassen.join(" ")}"><span class="kal-num">${dag}</span><span class="kal-pag ${c.klasse}">${c.tekst}</span></div>`;
  }
  $("kalGrid").innerHTML = html;
}

function wisselMaand(delta) {
  const d = new Date(kalJaar, kalMaand + delta, 1);
  kalJaar = d.getFullYear();
  kalMaand = d.getMonth();
  renderKalender();
}

/* ================= Detail ================= */

let detailId = null;

function openDetail(id) {
  detailId = id;
  renderDetail();
  $("detail").scrollTop = 0;
  $("detail").inert = false;
  $("detail").classList.add("open");
  $("home").classList.add("achter");
  $("home").inert = true;
}

function sluitDetail() {
  detailId = null;
  $("detail").classList.remove("open");
  $("detail").inert = true;
  $("home").classList.remove("achter");
  $("home").inert = false;
}

function renderDetail() {
  const b = vind(detailId);
  if (!b) return sluitDetail();
  const vandaag = vandaagStr();
  const s = status(b, vandaag), p = s.p;
  const pct = Math.min(100, Math.round((p.gelezen / b.totaalPaginas) * 100));

  $("detailTitel").textContent = b.titel;
  $("detailNavTitel").textContent = b.titel;

  const melding = {
    klaar: `<div class="melding groen">Uitgelezen! üéâ</div>`,
    gemist: `<div class="melding rood">Deadline gemist, nog ${pag(p.rest)}</div>`,
    gepland: `<div class="melding grijs">Je begint op ${lang(b.startDatum)}</div>`,
    gehaald: `<div class="melding groen">Doel van vandaag gehaald ‚úì</div>`,
  }[s.soort] || "";

  const logs = Object.entries(b.logs).sort(([a], [c]) => (a < c ? 1 : -1));
  const lijst = logs.length
    ? logs.map(([d, n]) => {
        const doel = doelOp(b, d);
        const kleur = doel === 0 ? "" : n >= doel ? "groen" : d < vandaag ? "oranje" : "";
        return `<button class="rij" data-logdatum="${d}">
          <span class="rij-label">${lang(d)}</span>
          <span class="rij-waarde ${kleur}">${pag(n)}</span>${chevron}
        </button>`;
      }).join("")
    : `<div class="lijst-leeg">Nog niets ingegeven.</div>`;

  $("detailInhoud").innerHTML = `
    <div class="card">
      <div class="meta">${p.gelezen} van ${b.totaalPaginas} pagina's gelezen ¬∑ ${pct}%</div>
      <div class="voortgang${p.rest === 0 ? " klaar" : ""}"><span style="width:${pct}%"></span></div>
      <div class="meta">${kort(b.startDatum)} ‚Üí ${kort(b.deadline)}</div>
      ${melding}
    </div>
    <div class="stats">
      <div class="stat"><div class="stat-label">${s.soort === "bezig" ? "Doel vandaag" : "Per dag"}</div>
        <div class="stat-waarde">${p.rest === 0 ? "‚Äì" : s.soort === "bezig" ? s.doel : p.perDag} <small>pag.</small></div></div>
      <div class="stat"><div class="stat-label">Nog te lezen</div>
        <div class="stat-waarde">${p.rest} <small>pag.</small></div></div>
      <div class="stat"><div class="stat-label">Dagen over</div>
        <div class="stat-waarde">${p.rest === 0 ? "‚Äì" : p.dagen}</div></div>
      <div class="stat"><div class="stat-label">Deadline</div>
        <div class="stat-waarde" style="font-size:22px;line-height:34px">${kort(b.deadline)}</div></div>
    </div>
    ${s.soort !== "gepland" ? `<div class="knoppen" style="margin-bottom:24px"><button class="knop" data-log="${b.id}">Gelezen ingeven</button></div>` : ""}
    <h2 class="sectie-kop">Geschiedenis</h2>
    <div class="lijst">${lijst}</div>
    <div class="knoppen">
      <button class="knop grijs" id="btnBewerk">Boek bewerken</button>
      <button class="knop rood" id="btnVerwijder">Boek verwijderen</button>
    </div>`;
}

/* ================= Sheets ================= */

let openSheetEl = null;

function openSheet(el) {
  openSheetEl = el;
  el.inert = false;
  el.scrollTop = 0;
  el.classList.add("open");
  $("backdrop").classList.add("open");
}

function sluitSheet() {
  if (!openSheetEl) return;
  document.activeElement?.blur();
  openSheetEl.classList.remove("open");
  openSheetEl.style.transform = "";
  openSheetEl.inert = true;
  openSheetEl = null;
  $("backdrop").classList.remove("open");
}

// Sheet naar beneden slepen om te sluiten
document.querySelectorAll(".sheet-greep").forEach(greep => {
  let startY = null, dy = 0;
  greep.addEventListener("pointerdown", e => {
    if (e.target.closest("button")) return;
    startY = e.clientY; dy = 0;
    greep.setPointerCapture(e.pointerId);
    greep.parentElement.classList.add("sleept");
  });
  greep.addEventListener("pointermove", e => {
    if (startY === null) return;
    dy = Math.max(0, e.clientY - startY);
    greep.parentElement.style.transform = `translateY(${dy}px)`;
  });
  const los = () => {
    if (startY === null) return;
    const sheet = greep.parentElement;
    sheet.classList.remove("sleept");
    sheet.style.transform = "";
    startY = null;
    if (dy > 90) sluitSheet();
  };
  greep.addEventListener("pointerup", los);
  greep.addEventListener("pointercancel", los);
});

/* ---------- Boek toevoegen / bewerken ---------- */

let bewerkId = null;

function openBoekSheet(id = null) {
  bewerkId = id;
  const b = id ? vind(id) : null;
  $("boekSheetTitel").textContent = b ? "Boek bewerken" : "Nieuw boek";
  $("boekOpslaan").textContent = b ? "Bewaren" : "Toevoegen";
  $("fTitel").value = b ? b.titel : "";
  $("fPaginas").value = b ? b.totaalPaginas : "";
  $("fStart").value = b ? b.startDatum : vandaagStr();
  $("fDeadline").value = b ? b.deadline : "";
  $("boekFout").textContent = "";
  openSheet($("sheetBoek"));
}

$("sheetBoek").addEventListener("submit", e => {
  e.preventDefault();
  const titel = $("fTitel").value.trim();
  const paginas = Number($("fPaginas").value.trim());
  const start = $("fStart").value;
  const deadline = $("fDeadline").value;
  const fout = t => { $("boekFout").textContent = t; };

  if (!titel) return fout("Geef een titel in.");
  if (!Number.isInteger(paginas) || paginas <= 0) return fout("Het aantal pagina's moet groter zijn dan 0.");
  if (!start) return fout("Kies een startdatum.");
  if (!deadline) return fout("Kies een deadline.");
  if (deadline <= start) return fout("De deadline moet na de startdatum liggen.");

  if (bewerkId) {
    Object.assign(vind(bewerkId), { titel, totaalPaginas: paginas, startDatum: start, deadline });
  } else {
    boeken.push({ id: "b" + Date.now(), titel, totaalPaginas: paginas, startDatum: start, deadline, logs: {} });
  }
  sluitSheet();
  bewaar();
});

/* ---------- Gelezen ingeven ---------- */

const log = { boekId: null, datum: null, modus: "aantal" };

// Totaal gelezen v√≥√≥r de gekozen dag: basis voor "tot pagina X".
const vorigTotaal = () => somLogs(vind(log.boekId).logs, d => d < log.datum);

function openLogSheet(id, datum = vandaagStr()) {
  const b = vind(id);
  log.boekId = id;
  log.datum = datum;
  $("logTitel").textContent = b.titel;
  $("logDatum").value = datum;
  $("logDatum").max = vandaagStr();
  vulLogVeld();
  openSheet($("sheetLog"));
}

function vulLogVeld() {
  const b = vind(log.boekId);
  const huidig = b.logs[log.datum];
  const vorig = vorigTotaal();
  document.querySelectorAll(".segment button").forEach(k =>
    k.classList.toggle("actief", k.dataset.modus === log.modus));
  $("logVeld").placeholder = log.modus === "aantal" ? "0" : String(vorig);
  $("logVeld").value = huidig === undefined ? "" : log.modus === "aantal" ? huidig : vorig + huidig;
  $("logWis").hidden = huidig === undefined;
  $("logFout").textContent = "";
  updateHint();
}

function updateHint() {
  const b = vind(log.boekId);
  const vorig = vorigTotaal();
  const v = parseInt($("logVeld").value, 10);
  let hint;
  if (isNaN(v)) {
    hint = log.modus === "aantal"
      ? `Je zat op pagina ${vorig} van ${b.totaalPaginas}`
      : `Vorige keer: pagina ${vorig}`;
  } else if (log.modus === "aantal") {
    hint = `pagina's ‚Üí tot pagina ${vorig + v}`;
  } else {
    hint = v >= vorig ? `= ${pag(v - vorig)} gelezen` : `Je zat al op pagina ${vorig}`;
  }
  $("logHint").textContent = hint;
}

document.querySelectorAll(".segment button").forEach(k => k.addEventListener("click", () => {
  const v = parseInt($("logVeld").value, 10);
  const vorig = vorigTotaal();
  const nieuw = k.dataset.modus;
  if (nieuw !== log.modus && !isNaN(v)) {
    $("logVeld").value = nieuw === "aantal" ? Math.max(0, v - vorig) : vorig + v;
  }
  log.modus = nieuw;
  document.querySelectorAll(".segment button").forEach(x => x.classList.toggle("actief", x === k));
  $("logVeld").placeholder = nieuw === "aantal" ? "0" : String(vorig);
  updateHint();
}));

document.querySelectorAll("[data-stap]").forEach(k => k.addEventListener("click", () => {
  const basis = log.modus === "aantal" ? 0 : vorigTotaal();
  const v = parseInt($("logVeld").value, 10);
  $("logVeld").value = Math.max(0, (isNaN(v) ? basis : v) + Number(k.dataset.stap));
  $("logFout").textContent = "";
  updateHint();
}));

$("logVeld").addEventListener("input", () => {
  $("logVeld").value = $("logVeld").value.replace(/\D/g, "");
  $("logFout").textContent = "";
  updateHint();
});

$("logDatum").addEventListener("change", () => {
  if (!$("logDatum").value) return;
  log.datum = $("logDatum").value;
  vulLogVeld();
});

$("sheetLog").addEventListener("submit", e => {
  e.preventDefault();
  const b = vind(log.boekId);
  const v = parseInt($("logVeld").value, 10);
  const fout = t => { $("logFout").textContent = t; };

  if (isNaN(v) || v < 0) return fout("Geef een getal in.");
  if (log.datum > vandaagStr()) return fout("Je kan geen dag in de toekomst ingeven.");
  const aantal = log.modus === "aantal" ? v : v - vorigTotaal();
  if (aantal < 0) return fout(`Je zat al op pagina ${vorigTotaal()}.`);

  b.logs[log.datum] = aantal;
  sluitSheet();
  bewaar();
});

$("logWis").addEventListener("click", () => {
  delete vind(log.boekId).logs[log.datum];
  sluitSheet();
  bewaar();
});

/* ================= Events ================= */

document.addEventListener("click", e => {
  const logKnop = e.target.closest("[data-log]");
  if (logKnop) return openLogSheet(logKnop.dataset.log);

  const kaart = e.target.closest("[data-open]");
  if (kaart) return openDetail(kaart.dataset.open);

  const logRij = e.target.closest("[data-logdatum]");
  if (logRij) return openLogSheet(detailId, logRij.dataset.logdatum);

  if (e.target.closest("[data-sluit]")) return sluitSheet();
  if (e.target.closest("#btnBewerk")) return openBoekSheet(detailId);
  if (e.target.closest("#btnVerwijder")) {
    const b = vind(detailId);
    if (confirm(`"${b.titel}" verwijderen? Dit kan niet ongedaan gemaakt worden.`)) {
      boeken = boeken.filter(x => x.id !== b.id);
      sluitDetail();
      bewaar();
    }
  }
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape") return openSheetEl ? sluitSheet() : detailId && sluitDetail();
  const kaart = e.target.closest?.("[data-open]");
  if (kaart && (e.key === "Enter" || e.key === " ")) {
    e.preventDefault();
    openDetail(kaart.dataset.open);
  }
});

$("btnNieuw").addEventListener("click", () => openBoekSheet());
$("btnTerug").addEventListener("click", sluitDetail);
$("backdrop").addEventListener("click", sluitSheet);
$("vorigeMaand").addEventListener("click", () => wisselMaand(-1));
$("volgendeMaand").addEventListener("click", () => wisselMaand(1));
$("maandTitel").addEventListener("click", () => {
  const d = new Date();
  kalJaar = d.getFullYear();
  kalMaand = d.getMonth();
  renderKalender();
});

// Kleine titel in de navigatiebalk tonen zodra de grote titel wegscrollt
document.querySelectorAll(".view").forEach(view => {
  const nav = view.querySelector(".navbar");
  view.addEventListener("scroll", () => nav.classList.toggle("scrolled", view.scrollTop > 36), { passive: true });
});

/* ================= Render ================= */

function render() {
  renderLijst();
  renderKalender();
  if (detailId) renderDetail();
}

// Als de app de volgende dag weer geopend wordt, alles opnieuw berekenen.
let laatsteDag = vandaagStr();
function controleerNieuweDag() {
  if (vandaagStr() !== laatsteDag) {
    laatsteDag = vandaagStr();
    render();
  }
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) controleerNieuweDag(); });
setInterval(controleerNieuweDag, 60000);

// Wijzigingen in een ander tabblad oppikken
window.addEventListener("storage", e => { if (e.key === SLEUTEL) { boeken = laden(); render(); } });

render();

} else {

  const toestel = document.getElementById("toestel");
  const app = document.getElementById("kaderApp");
  app.src = location.pathname + "?app";
  document.getElementById("kaderIcoon").src = document.querySelector('link[rel="apple-touch-icon"]').href;

  // Toestel verkleinen als het venster te laag is
  const schaal = () => {
    const h = parseFloat(getComputedStyle(toestel).getPropertyValue("--h")) + 24;
    toestel.style.zoom = Math.min(1, (innerHeight - 48) / h);
  };
  document.querySelectorAll(".modellen button").forEach(k => k.addEventListener("click", () => {
    document.querySelectorAll(".modellen button").forEach(x => x.setAttribute("aria-pressed", x === k));
    toestel.style.setProperty("--w", k.dataset.w + "px");
    toestel.style.setProperty("--h", k.dataset.h + "px");
    toestel.classList.toggle("se", "se" in k.dataset);
    schaal();
  }));
  const klok = () => {
    const d = new Date();
    document.getElementById("klok").textContent = d.getHours() + ":" + String(d.getMinutes()).padStart(2, "0");
  };
  klok();
  setInterval(klok, 15000);
  addEventListener("resize", schaal);
  schaal();
}
